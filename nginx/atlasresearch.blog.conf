# =============================================================================
# ATLAS RESEARCH — Nginx site config (bản HTTPS đầy đủ)
# File đích trên server: /etc/nginx/sites-available/atlasresearch.blog
#
# Không cần copy tay: scripts/setup.sh tự cài file này khi chứng chỉ
# Let's Encrypt đã có. Nếu chưa có chứng chỉ, setup.sh cài một cấu hình tạm
# (chỉ HTTP) để xin chứng chỉ trước — xem README.md.
#
# setup.sh tự động thay:
#   - "atlasresearch.blog"           -> biến DOMAIN trong setup.sh
#   - "/run/php/php8.2-fpm.sock"     -> socket PHP-FPM thực tế trên server
# =============================================================================

# ---- Thời gian cache trình duyệt cho Affiliate Hub, theo loại nội dung ----
map $sent_http_content_type $atlas_hub_expires {
    default             off;
    ~*text/html         epoch;    # HTML luôn được kiểm tra lại -> sửa nội dung có hiệu lực ngay
    ~*text/css          30d;
    ~*javascript        30d;
    ~*image/            30d;
    ~*font/             30d;
}

# =============================================================================
# HTTP (cổng 80): chỉ phục vụ xác thực Let's Encrypt, còn lại chuyển sang HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name atlasresearch.blog www.atlasresearch.blog;

    # Certbot (webroot) dùng thư mục này cả khi xin mới lẫn khi gia hạn
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/atlasresearch.blog/wordpress;
        default_type text/plain;
    }

    location / {
        return 301 https://atlasresearch.blog$request_uri;
    }
}

# =============================================================================
# HTTPS www -> bản không www (khớp với canonical URL)
# =============================================================================
server {
    # Nginx >= 1.25.1: đổi thành "listen 443 ssl;" + dòng "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.atlasresearch.blog;

    ssl_certificate     /etc/letsencrypt/live/atlasresearch.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlasresearch.blog/privkey.pem;

    return 301 https://atlasresearch.blog$request_uri;
}

# =============================================================================
# HTTPS — SITE CHÍNH
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlasresearch.blog;

    # ---- SSL (Let's Encrypt, cấu hình "intermediate" của Mozilla) ----
    ssl_certificate     /etc/letsencrypt/live/atlasresearch.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlasresearch.blog/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:atlas_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/atlasresearch.blog/wordpress;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 64m;

    access_log /var/www/atlasresearch.blog/logs/access.log;
    error_log  /var/www/atlasresearch.blog/logs/error.log;

    # ---- Header bảo mật ----
    # Lưu ý: location nào tự khai báo add_header sẽ KHÔNG kế thừa các dòng này.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Bật HSTS khi HTTPS đã chạy ổn định (trình duyệt sẽ ghi nhớ trong 1 năm):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # =========================================================================
    # GZIP COMPRESSION
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # =========================================================================
    # KHỐI TĨNH — AFFILIATE HUB (/doi-tac/)
    # "^~" khiến Nginx dừng so khớp regex -> không request nào ở đây tới PHP-FPM.
    # =========================================================================
    location = /doi-tac {
        return 301 /doi-tac/;
    }

    location ^~ /doi-tac/ {
        alias /var/www/atlasresearch.blog/affiliate_hub/;
        index index.html;
        try_files $uri $uri/ =404;
        expires $atlas_hub_expires;

        location ~ \.php$ {
            return 404;
        }
    }

    # =========================================================================
    # CHẶN TRUY CẬP NHẠY CẢM
    # Location regex được xét THEO THỨ TỰ -> các khối chặn phải đứng trước
    # khối "\.php$" bên dưới, nếu không sẽ không bao giờ được áp dụng.
    # =========================================================================
    location = /wp-config.php {
        deny all;
    }

    # File/thư mục ẩn: .git, .env, .htaccess ... (trừ .well-known)
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Không cho thực thi PHP trong thư mục upload của WordPress
    location ~* /(?:uploads|files)/.*\.(?:php\d?|phtml|phar)$ {
        deny all;
    }

    # Bỏ comment nếu KHÔNG dùng Jetpack / ứng dụng WordPress trên điện thoại:
    # location = /xmlrpc.php { deny all; }

    # =========================================================================
    # KHỐI ĐỘNG — WORDPRESS (Góc Kiến Thức / Blog SEO)
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    # Browser cache cho asset tĩnh của WordPress
    location ~* \.(?:css|js|jpe?g|png|gif|webp|avif|svg|woff2?|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # RankMath / WordPress tự sinh robots.txt và favicon khi không có file thật
    location = /robots.txt {
        log_not_found off;
        access_log off;
        try_files $uri /index.php?$args;
    }
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri /index.php?$args;
    }
}
