# Xuất bản thư mục affiliate_hub/ lên GitHub Pages mỗi khi push lên nhánh main.
# Trang xem thử: https://hoang-minh-nghia.github.io/atlas-research-deploy/
name: Deploy Affiliate Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "affiliate_hub/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: affiliate_hub
      - id: deployment
        uses: actions/deploy-pages@v4
